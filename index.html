<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumax Energy — Engineering Management</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Lumax Energy — Engineering Management</h1>
    <div class="header-actions">
      <span class="auth-badge" id="auth-badge">Not signed in</span>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-load" title="Load data/projects.json from GitHub">Load</button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-save" title="Save data/projects.json to GitHub">Save</button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-export">Export</button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-import">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
      <button type="button" class="btn btn-ghost btn-sm" id="btn-settings">Settings</button>
    </div>
  </header>

  <main class="main">
    <section id="view-list">
      <div class="toolbar">
        <input type="search" class="search-input" id="search" placeholder="Search client, project code, or sales order…" />
        <label class="checkbox-label">
          <input type="checkbox" id="show-archived" /> Show archived
        </label>
        <button type="button" class="btn" id="btn-new-project">+ Project</button>
      </div>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="view-detail" class="hidden"></section>
  </main>

  <div class="overlay hidden" id="overlay"></div>
  <div class="status-bar" id="status-bar" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
